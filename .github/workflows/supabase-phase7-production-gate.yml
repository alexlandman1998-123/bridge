name: Supabase Phase 7 Production Gate

on:
  pull_request:
    paths:
      - 'scripts/supabase-phase7-production-execution.mjs'
      - 'scripts/supabase-phase7-production-execution.test.mjs'
      - 'docs/supabase-phase-5-application-manifest.json'
      - 'docs/supabase-phase-7-implementation-status.md'
      - 'docs/database-release-runbook.md'
      - 'package.json'
      - '.github/workflows/supabase-phase7-production-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/supabase-phase7-production-execution.mjs'
      - 'scripts/supabase-phase7-production-execution.test.mjs'
      - 'docs/supabase-phase-5-application-manifest.json'
      - 'docs/supabase-phase-7-implementation-status.md'
      - 'docs/database-release-runbook.md'
      - 'package.json'
      - '.github/workflows/supabase-phase7-production-gate.yml'

permissions:
  contents: read

jobs:
  production-gate:
    name: Verify fail-closed production execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test production execution gate
        run: node scripts/supabase-phase7-production-execution.test.mjs

      - name: Verify manifest coverage
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const manifest = require('./docs/supabase-phase-5-application-manifest.json')
          if (manifest.linkedProjectRef !== 'isdowlnollckzvltkasn') throw new Error('Unexpected manifest project ref')
          if (!Array.isArray(manifest.rows) || manifest.rows.length === 0) throw new Error('Manifest rows are missing')
          const plan = spawnSync(process.execPath, ['scripts/supabase-phase7-production-execution.mjs', '--plan', '--json'], { encoding: 'utf8' })
          if (plan.status !== 0) throw new Error(plan.stderr || 'Phase 7 plan failed')
          const parsed = JSON.parse(plan.stdout)
          if (!Number.isInteger(parsed.count) || parsed.count <= 0) throw new Error('Phase 7 plan count is invalid')
          if (parsed.count > manifest.rows.length) throw new Error('Phase 7 plan count exceeds manifest rows')
          NODE
