name: Attorney calendar invite

on:
  pull_request:
    paths:
      - 'the-it-guy/src/components/attorney/scheduling/**'
      - 'the-it-guy/src/components/client-portal/appointments/**'
      - 'the-it-guy/src/core/appointments/**'
      - 'the-it-guy/src/lib/api.js'
      - 'the-it-guy/src/lib/appointmentAvailabilityEngine.js'
      - 'the-it-guy/src/lib/appointmentTypeTemplates.js'
      - 'the-it-guy/src/services/appointmentNotificationService.js'
      - 'the-it-guy/src/services/appointmentRescheduleService.js'
      - 'the-it-guy/src/services/appointmentTemplateService.js'
      - 'the-it-guy/src/services/attorneyOperations.js'
      - 'the-it-guy/src/services/clientAppointmentResponseService.js'
      - 'the-it-guy/src/services/appointmentDashboardService.js'
      - 'the-it-guy/src/services/sellerPortalAppointmentsService.js'
      - 'the-it-guy/src/components/appointments/dashboard/**'
      - 'the-it-guy/src/pages/ClientPortal.jsx'
      - 'the-it-guy/src/hooks/useTransactionLiveRefresh.js'
      - 'the-it-guy/src/core/transactions/stablePortalWorkspace.js'
      - 'the-it-guy/scripts/helpers/appointmentResponseFixture.mjs'
      - 'the-it-guy/scripts/shared-matter-journey-live-**'
      - 'supabase/migrations/*attorney_cross_role_appointment*'
      - 'the-it-guy/src/services/attorneyAppointmentManagement.js'
      - 'the-it-guy/src/services/__tests__/attorneyAppointmentManagement.test.js'
      - 'the-it-guy/src/services/__tests__/appointmentReminderReschedule.test.js'
      - 'the-it-guy/src/pages/AttorneySchedulingPage.jsx'
      - 'the-it-guy/src/pages/__tests__/AttorneySchedulingPage.test.jsx'
      - 'the-it-guy/supabase-tests/**'
      - 'the-it-guy/scripts/appointment-**'
      - 'the-it-guy/scripts/attorney-calendar-**'
      - 'the-it-guy/vitest.attorney-calendar.config.js'
      - 'supabase/functions/send-email/**'
      - 'supabase/functions/attorney-appointment-delivery-worker/**'
      - 'supabase/functions/_shared/attorneyAppointmentDelivery.ts'
      - 'the-it-guy/src/services/attorneyAppointmentDelivery.js'
      - 'the-it-guy/src/services/appointmentCalendarInviteService.js'
      - 'supabase/config.toml'
      - 'supabase/migrations/*attorney_calendar*'
      - 'supabase/migrations/*attorney_appointment_management*'
      - '.github/workflows/attorney-calendar-invite.yml'
  workflow_dispatch:
    inputs:
      certify_staging:
        description: Run the disposable Phase 7 staging certification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: the-it-guy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-it-guy/package-lock.json
      - run: npm ci
      - run: npm run test:attorney-calendar-invite
      - run: node --test scripts/shared-matter-journey-live-hook.test.mjs scripts/shared-matter-journey-live-refresh.test.mjs scripts/appointment-dashboard.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env ../supabase/functions/attorney-appointment-delivery-worker/index.test.ts

  certify-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.certify_staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: the-it-guy
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      ATTORNEY_DEMO_EMAIL: ${{ secrets.ATTORNEY_DEMO_EMAIL }}
      ATTORNEY_DEMO_PASSWORD: ${{ secrets.ATTORNEY_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-it-guy/package-lock.json
      - run: npm ci
      - run: npm run certify:attorney-calendar:staging
